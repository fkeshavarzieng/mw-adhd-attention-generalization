name: Corrected v2 validation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'results/v2_*.csv'
      - 'requirements.txt'
      - '.github/workflows/v2-validation.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'results/v2_*.csv'
      - 'requirements.txt'
      - '.github/workflows/v2-validation.yml'
  workflow_dispatch:

jobs:
  v2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile v2 scripts
        run: |
          python -m compileall -q scripts tests
      - name: Exercise all v2 scripts on synthetic data
        run: |
          python tests/smoke_v2_pipeline.py
